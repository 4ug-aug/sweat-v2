  <style>
    .ant-part { fill: #282522; }
    .ant-body {
      transform-box: fill-box;
      transform-origin: 55% 48%;
      animation: settle var(--colony-mark-settle, 6.4s) ease-in-out infinite;
      animation-delay: var(--colony-mark-delay, 0s);
    }
    .mandible-left,
    .mandible-right {
      transform-box: fill-box;
      animation-duration: var(--colony-mark-nibble, 6.8s);
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }
    .mandible-left {
      transform-origin: 82% 88%;
      animation-name: mandible-left;
      animation-delay: var(--colony-mark-delay, 0s);
    }
    .mandible-right {
      transform-origin: 76% 94%;
      animation-name: mandible-right;
      animation-delay: var(--colony-mark-delay, 0s);
    }
    @keyframes mandible-left {
      0%, 4%, 16%, 100% { transform: rotate(0); }
      7% { transform: rotate(-18deg); }
      10% { transform: rotate(8deg); }
      13% { transform: rotate(-14deg); }
    }
    @keyframes mandible-right {
      0%, 5%, 17%, 100% { transform: rotate(0); }
      8% { transform: rotate(16deg); }
      11% { transform: rotate(-6deg); }
      14% { transform: rotate(12deg); }
    }
    @keyframes settle {
      0%, 18%, 100% { transform: translate(0, 0) rotate(0); }
      8% { transform: translate(2%, 5%) rotate(-3deg); }
      13% { transform: translate(-1%, 2%) rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ant-part,
      .ant-body { animation: none; }
    }
  </style>

